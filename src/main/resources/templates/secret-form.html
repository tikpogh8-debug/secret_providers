<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Share a secret</title>
</head>
<body>
<h1>Share a secret</h1>

<form th:action="@{/secrets}" th:object="${secretForm}" method="post">
    <div>
        <label for="content">Secret</label><br>
        <textarea id="content" th:field="*{content}" rows="8" cols="60" required></textarea>
        <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" style="color: red"></p>
    </div>
    <button type="submit">Create one-time link</button>
</form>

<form th:action="@{/logout}" method="post">
    <button type="submit">Log out</button>
</form>
</body>
</html>
