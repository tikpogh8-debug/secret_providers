<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reveal secret</title>
</head>
<body>
<h1>You received a secret</h1>
<p>It will be permanently deleted as soon as you reveal it.</p>

<form th:action="@{/secrets/{token}/reveal(token=${token})}" method="post">
    <button type="submit">Reveal secret</button>
</form>
</body>
</html>
